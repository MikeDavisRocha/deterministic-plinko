name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  cross-engine:
    # The check ADR 0002 asks for and that nothing else can stand in for: a
    # same-engine determinism test passes under V8 and passes under
    # JavaScriptCore while the two disagree with each other. Node and Chrome are
    # both V8, so this is the only job here that can falsify the project's
    # central claim.
    name: trajectories reproduce off V8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run cross-engine
