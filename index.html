<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Deterministic Plinko</title>
    <!-- Inline, so it costs no request: without it the browser asks the origin
         root for /favicon.ico and takes a 404 on every load. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0f14'/><circle cx='10' cy='10' r='2.5' fill='%232a3441'/><circle cx='22' cy='10' r='2.5' fill='%232a3441'/><circle cx='16' cy='17' r='2.5' fill='%232a3441'/><circle cx='16' cy='25' r='4.5' fill='%23f5a524'/></svg>"
    />
    <meta
      name="description"
      content="A Plinko board on a hand-written physics solver: an honest simulation and a provably fair outcome-first mode, side by side, reaching the same RTP by opposite routes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-BwaNowFA.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DaeNuiqx.css">
  </head>
  <body>
    <main id="app">
      <div id="stage"></div>
      <aside id="panel">
        <div id="modes" class="row seg">
          <button id="mode-physics" class="on">physics-first</button>
          <button id="mode-outcome">outcome-first</button>
        </div>

        <!-- Each row count is its own board, its own 100-million drop
             measurement and its own solved tables. See ADR 0008. -->
        <div class="field">
          <label>rows <span class="dim">own board</span></label>
          <div id="rows" class="row seg">
            <button id="rows-8">8</button>
            <button id="rows-12">12</button>
            <button id="rows-16" class="on">16</button>
          </div>
        </div>

        <div class="field">
          <label>risk <span class="dim">same rtp</span></label>
          <div id="risks" class="row seg">
            <button id="risk-low">low</button>
            <button id="risk-medium" class="on">medium</button>
            <button id="risk-high">high</button>
          </div>
        </div>

        <div class="field">
          <label for="bet">bet</label>
          <input id="bet" type="text" inputmode="decimal" value="1" />
        </div>

        <!-- Physics-First: the seed decides the bin, so the player holds it. -->
        <div id="physics-controls">
          <div class="field">
            <label for="seed">seed</label>
            <input id="seed" type="text" inputmode="numeric" value="1" />
          </div>
        </div>

        <!-- Outcome-First: the bin is decided before the disc moves, so what
             the player holds is the client seed and the published commitment. -->
        <div id="outcome-controls" hidden>
          <div class="field">
            <label for="client-seed">client seed</label>
            <input id="client-seed" type="text" value="player-one" />
          </div>
          <div class="field">
            <label>commitment <span class="dim">sha-256 of server seed</span></label>
            <code id="commit" class="hash">—</code>
          </div>
          <!-- The revealed seed is worthless without the hash it is checked
               against, so the closed session shows both side by side. The
               field above has already moved on to the next session. -->
          <div id="reveal-box" hidden>
            <div class="field">
              <label>closed session <span class="dim">was committed to</span></label>
              <code id="revealed-commit" class="hash">—</code>
            </div>
            <div class="field">
              <label>server seed <span class="dim">now revealed</span></label>
              <code id="server-seed" class="hash">—</code>
            </div>
            <p id="verdict" class="verdict">—</p>
          </div>
          <button id="reveal">reveal &amp; verify</button>
        </div>

        <div class="row">
          <button id="drop" class="primary">drop</button>
          <button id="replay">replay</button>
        </div>
        <div class="row">
          <button id="monte">run 10 000 sims</button>
          <button id="mute" class="narrow">sound: on</button>
        </div>
        <div id="histogram"></div>
        <dl id="readout">
          <dt>balance</dt><dd id="r-balance" class="big">1000.00</dd>
          <dt>last win</dt><dd id="r-payout">—</dd>
          <dt id="l-target" hidden>target bin</dt><dd id="r-target" hidden>—</dd>
          <dt>last bin</dt><dd id="r-bin">—</dd>
          <dt>multiplier</dt><dd id="r-mult">—</dd>
          <dt id="l-nonce" hidden>nonce</dt><dd id="r-nonce" hidden>—</dd>
          <dt>drop seed</dt><dd id="r-seed">—</dd>
        </dl>
        <dl id="readout" class="secondary">
          <dt>drops</dt><dd id="r-drops">0</dd>
          <dt>wagered</dt><dd id="r-wagered">0.00</dd>
          <dt>returned</dt><dd id="r-returned">0.00</dd>
          <dt>rtp so far</dt><dd id="r-actual">—</dd>
          <dt>rtp target</dt><dd id="r-rtp">—</dd>
          <dt>board</dt><dd id="r-rows">16</dd>
          <dt>tick</dt><dd id="r-tick">120 hz</dd>
          <dt>fps</dt><dd id="r-fps">—</dd>
        </dl>
        <button id="reset">reset balance</button>
      </aside>
    </main>
  </body>
</html>
